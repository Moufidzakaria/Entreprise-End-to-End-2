services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: end_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-playwright}
      POSTGRES_DB: projet
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U end_user -d projet
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  playwright-tests:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL:-https://automationexercise.com}
      LOGIN_EMAIL: ${LOGIN_EMAIL:-}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
      API_LOGIN_EMAIL: ${API_LOGIN_EMAIL:-}
      API_LOGIN_PASSWORD: ${API_LOGIN_PASSWORD:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: end_user
      DB_PASSWORD: ${DB_PASSWORD:-playwright}
      DB_NAME: projet
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results

volumes:
  postgres-data: