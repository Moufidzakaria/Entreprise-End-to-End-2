trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  BASE_URL: 'https://automationexercise.com'
  CI: 'true'
  NODE_VERSION: '20.x'

jobs:
  - job: Playwright
    displayName: Playwright tests
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - task: UseNode@1
        displayName: Use Node.js $(NODE_VERSION)
        inputs:
          version: $(NODE_VERSION)

      - script: npm ci
        displayName: Install dependencies

      - script: npx playwright install --with-deps chromium
        displayName: Install Chromium

      - script: npx playwright test
        displayName: Run Playwright tests
        env:
          BASE_URL: $(BASE_URL)
          LOGIN_EMAIL: $[variables['LOGIN_EMAIL']]
          LOGIN_PASSWORD: $[variables['LOGIN_PASSWORD']]
          CI: $(CI)

      - task: PublishTestResults@2
        displayName: Publish JUnit results
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: playwright-report/results.xml
          failTaskOnMissingResultsFile: false

      - bash: mkdir -p playwright-report
        displayName: Ensure report directory exists
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: Publish Playwright report
        condition: always()
        inputs:
          targetPath: playwright-report
          artifact: playwright-report
          publishLocation: pipeline

  - job: OWASP_ZAP
    displayName: OWASP ZAP baseline scan
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - bash: |
          set -Eeuo pipefail

          report_dir="$(Build.ArtifactStagingDirectory)/zap"
          mkdir -p "$report_dir"
          chmod 777 "$report_dir"

          cleanup() {
            docker rm -f juice-shop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name juice-shop --network host bkimminich/juice-shop:latest

          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs juice-shop
            echo "Juice Shop did not become ready on 127.0.0.1:3000."
            exit 1
          fi

          cp security/zap.yaml "$report_dir/zap.yaml"
          docker run --rm --network host \
            -v "$report_dir:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -config proxy.port=18080 -autorun /zap/wrk/zap.yaml

          python3 - "$report_dir/zap-report.json" <<'PY'
          import json
          import sys

          report_path = sys.argv[1]
          with open(report_path, encoding="utf-8") as report_file:
              report = json.load(report_file)

          findings = [
              alert
              for site in report.get("site", [])
              for alert in site.get("alerts", [])
          ]
          high_or_critical = [
              alert
              for alert in findings
              if int(alert.get("riskcode", 0)) >= 3
              or str(alert.get("riskdesc", "")).lower().startswith(("high", "critical"))
          ]

          print(f"ZAP reported {len(findings)} alerts.")
          for alert in high_or_critical:
              print(
                  f"BLOCKING: {alert.get('riskdesc', 'High/Critical')} - "
                  f"{alert.get('alert', 'Unspecified alert')}"
              )

          if high_or_critical:
              sys.exit(1)
          PY
        displayName: Run passive ZAP scan against local Juice Shop

      - task: PublishPipelineArtifact@1
        displayName: Publish OWASP ZAP reports
        condition: always()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/zap
          artifact: zap-security-report
          publishLocation: pipeline
